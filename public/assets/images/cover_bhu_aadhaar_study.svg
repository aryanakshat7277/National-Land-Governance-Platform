<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2A47"/>
      <stop offset="50%" stop-color="#1A5276"/>
      <stop offset="100%" stop-color="#2471A3"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#F8C471"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F1F5F9" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Cover Base -->
  <rect width="600" height="800" fill="url(#coverBg)"/>

  <!-- Geometric Watermark Grid -->
  <g stroke="#FFFFFF" stroke-width="0.7" opacity="0.08">
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
  </g>

  <!-- Circular Radar / Lat-Long Graphic -->
  <g transform="translate(480, 140)" opacity="0.15">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="-200" y1="0" x2="200" y2="0" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="-200" x2="0" y2="200" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Top Institutional Bar -->
  <g transform="translate(50, 45)">
    <!-- Tricolor pill -->
    <rect x="0" y="0" width="8" height="34" rx="4" fill="#FF9933"/>
    <rect x="0" y="11" width="8" height="12" fill="#FFFFFF"/>
    <rect x="0" y="23" width="8" height="11" rx="4" fill="#138808"/>
    
    <text x="22" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">NATIONAL DIGITAL PLATFORM FOR LAND GOVERNANCE</text>
    <text x="22" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="url(#goldAccent)" letter-spacing="1">MINISTRY OF RURAL DEVELOPMENT • DEPT. OF LAND RESOURCES</text>
  </g>

  <!-- Report Category Ribbon -->
  <g transform="translate(50, 120)">
    <rect width="180" height="26" rx="4" fill="url(#goldAccent)"/>
    <text x="14" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#0F172A" letter-spacing="1">SPECIAL POLICY REPORT</text>
    <text x="200" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#93C5FD">VOL. IV • ISSUE 2 • 2024</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(50, 185)">
    <text x="0" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Bhu-Aadhaar</text>
    <text x="0" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#F8FAFC" letter-spacing="-0.5">&amp; National Cadastral</text>
    <text x="0" y="120" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="url(#goldAccent)" letter-spacing="-0.5">Interoperability</text>

    <text x="0" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#CBD5E1" width="500">
      <tspan x="0" dy="0">Standardizing 14-Digit ULPIN Geospatial Identifiers</tspan>
      <tspan x="0" dy="22">Across Revenue, Banking, and Judiciary Systems</tspan>
    </text>
  </g>

  <!-- Visual Central Graphic: Cadastral Interoperability Diagram -->
  <g transform="translate(50, 390)" filter="url(#shadow)">
    <rect width="500" height="240" rx="12" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Header of Card -->
    <rect x="0" y="0" width="500" height="34" rx="12" fill="#E2E8F0"/>
    <circle cx="20" cy="17" r="4" fill="#EF4444"/>
    <circle cx="36" cy="17" r="4" fill="#F59E0B"/>
    <circle cx="52" cy="17" r="4" fill="#10B981"/>
    <text x="75" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#334155">ULPIN INTEROPERABILITY ARCHITECTURE MATRIX</text>

    <!-- Hub Diagram -->
    <!-- Center Node (Bhu-Aadhaar Hub) -->
    <circle cx="250" cy="135" r="42" fill="#1A5276"/>
    <circle cx="250" cy="135" r="36" fill="none" stroke="#F39C12" stroke-width="2"/>
    <text x="250" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">BHU-AADHAAR</text>
    <text x="250" y="145" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#F8C471" text-anchor="middle">14-DIGIT PIN</text>

    <!-- Connected Node 1 (Revenue Registries) -->
    <g transform="translate(90, 80)">
      <rect width="90" height="42" rx="6" fill="#F8FAFC" stroke="#1A5276" stroke-width="1.5"/>
      <text x="45" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#1A5276" text-anchor="middle">Revenue Dept</text>
      <text x="45" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="500" fill="#64748B" text-anchor="middle">RoR / Jamabandi</text>
      <line x1="90" y1="21" x2="160" y2="45" stroke="#1A5276" stroke-width="1.5" stroke-dasharray="3,2"/>
    </g>

    <!-- Connected Node 2 (NJDG Judicial) -->
    <g transform="translate(90, 160)">
      <rect width="90" height="42" rx="6" fill="#F8FAFC" stroke="#C0392B" stroke-width="1.5"/>
      <text x="45" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#C0392B" text-anchor="middle">NJDG Courts</text>
      <text x="45" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="500" fill="#64748B" text-anchor="middle">Litigation Flag</text>
      <line x1="90" y1="21" x2="160" y2="-5" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="3,2"/>
    </g>

    <!-- Connected Node 3 (Banking / KCC) -->
    <g transform="translate(320, 80)">
      <rect width="90" height="42" rx="6" fill="#F8FAFC" stroke="#1E8449" stroke-width="1.5"/>
      <text x="45" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#1E8449" text-anchor="middle">Banking / KCC</text>
      <text x="45" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="500" fill="#64748B" text-anchor="middle">Agri Mortgage</text>
      <line x1="0" y1="21" x2="-28" y2="45" stroke="#1E8449" stroke-width="1.5" stroke-dasharray="3,2"/>
    </g>

    <!-- Connected Node 4 (Survey of India) -->
    <g transform="translate(320, 160)">
      <rect width="90" height="42" rx="6" fill="#F8FAFC" stroke="#8E44AD" stroke-width="1.5"/>
      <text x="45" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#8E44AD" text-anchor="middle">Survey of India</text>
      <text x="45" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="500" fill="#64748B" text-anchor="middle">CORS / Drone GIS</text>
      <line x1="0" y1="21" x2="-28" y2="-5" stroke="#8E44AD" stroke-width="1.5" stroke-dasharray="3,2"/>
    </g>

    <!-- Bottom Stat inside Card -->
    <rect x="20" y="212" width="460" height="20" rx="4" fill="#EBF5FB"/>
    <text x="250" y="225" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#1A5276" text-anchor="middle">Coverage: 28 States &amp; UTs • 6.2 Lakh Villages Seeded • WGS-84 Polygon Standard</text>
  </g>

  <!-- Authors & Publication Meta -->
  <g transform="translate(50, 675)">
    <line x1="0" y1="0" x2="500" y2="0" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
    
    <text x="0" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Lead Authors &amp; Working Group:</text>
    <text x="0" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94A3B8">Dr. A. K. Somvanshi (IIT Delhi) • S. Ramachandran (NIC Land Div.) • Prof. Neha Varma (CEPT)</text>
    
    <g transform="translate(0, 68)">
      <text x="0" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#93C5FD">DOI: 10.1016/j.landgov.2024.03.018</text>
      <text x="500" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="end">DoLR Policy Document No. 2024-NDP-08</text>
    </g>
  </g>
</svg>
