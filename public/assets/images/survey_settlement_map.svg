<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="settleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F8FA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#settleBg)"/>
  <rect x="0" y="0" width="400" height="6" fill="#FF9933"/>
  <rect x="400" y="0" width="400" height="6" fill="#E2E8F0"/>
  <rect x="800" y="0" width="400" height="6" fill="#138808"/>

  <!-- Header -->
  <g transform="translate(60, 50)">
    <rect width="1080" height="70" rx="12" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <circle cx="45" cy="35" r="22" fill="#1E8449"/>
    <circle cx="45" cy="35" r="8" fill="#F1C40F"/>
    <text x="80" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1A5276">SVAMITVA DRONE SETTLEMENT (ABADI) SURVEY PLATFORM</text>
    <text x="80" y="52" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6C757D">Survey of India (SoI) Ground Control Points (CORS Network) · High Precision 5cm Ortho-Rectified Imagery</text>
    <rect x="940" y="20" width="120" height="30" rx="6" fill="#EAFAF1" stroke="#2ECC71" stroke-width="1"/>
    <text x="1000" y="40" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1E8449" text-anchor="middle">5cm RES / CORS RTK</text>
  </g>

  <!-- Left: Legacy 1930 Cadastral Cloth Map (Shajra) -->
  <g transform="translate(60, 150)">
    <rect width="520" height="470" rx="16" fill="#FFFDF8" stroke="#E5D9C5" stroke-width="2"/>
    <rect width="520" height="45" rx="16" fill="#F9F4EB"/>
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#7D6608">LEGACY CADASTRAL MAP (1930s SHAJRA CLOTH SURVEY)</text>
    <span style="display:none">Legacy paper</span>

    <g transform="translate(30, 65)">
      <!-- Distorted old boundaries -->
      <path d="M40,50 L140,40 L160,180 L30,170 Z" fill="#F5EFE6" stroke="#8D6E63" stroke-width="2"/>
      <text x="85" y="110" font-family="Courier, monospace" font-size="11" fill="#6D4C41">Khasra 42 (Unclear)</text>

      <path d="M140,40 L340,30 L320,190 L160,180 Z" fill="#F5EFE6" stroke="#8D6E63" stroke-width="2"/>
      <text x="230" y="110" font-family="Courier, monospace" font-size="11" fill="#6D4C41">Gat 43 (Encroached)</text>

      <path d="M30,170 L160,180 L180,330 L20,320 Z" fill="#F5EFE6" stroke="#8D6E63" stroke-width="2"/>
      <text x="85" y="250" font-family="Courier, monospace" font-size="11" fill="#6D4C41">Abadi (Unsurveyed)</text>

      <path d="M160,180 L320,190 L350,340 L180,330 Z" fill="#F5EFE6" stroke="#8D6E63" stroke-width="2"/>
      <text x="240" y="260" font-family="Courier, monospace" font-size="11" fill="#6D4C41">Charnot (Disputed)</text>

      <!-- Stamp -->
      <g transform="translate(320, 260) rotate(-15)">
        <circle cx="45" cy="45" r="40" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="4"/>
        <text x="45" y="42" font-family="Inter, sans-serif" font-size="9" font-weight="800" fill="#C0392B" text-anchor="middle">TEHSIL RECORD</text>
        <text x="45" y="55" font-family="Inter, sans-serif" font-size="8" fill="#C0392B" text-anchor="middle">MUTATION 1954</text>
      </g>
    </g>

    <!-- Bottleneck Indicator -->
    <g transform="translate(20, 420)">
      <rect width="480" height="35" rx="8" fill="#FADBD8" stroke="#E74C3C" stroke-width="1"/>
      <text x="15" y="22" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#C0392B">
        ⚠️ High litigation vulnerability: Non-georeferenced, paper shrinkage error ±15%
      </text>
    </g>
  </g>

  <!-- Right: Modern 2024 Drone-Surveyed Georeferenced RoR -->
  <g transform="translate(620, 150)">
    <rect width="520" height="470" rx="16" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect width="520" height="45" rx="16" fill="#E8F8F5"/>
