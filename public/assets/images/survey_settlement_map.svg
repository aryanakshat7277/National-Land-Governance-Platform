    <g transform="translate(30, 65)">
      <!-- Accurate Drone Parcels with CORS markers -->
      <polygon points="40,50 140,40 155,180 35,170" fill="#EAF2FA" stroke="#2E86C1" stroke-width="2.5"/>
      <circle cx="40" cy="50" r="5" fill="#E74C3C"/>
      <circle cx="140" cy="40" r="5" fill="#E74C3C"/>
      <text x="90" y="110" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#1A5276">PARCEL 42 (0.45 Ha)</text>

      <polygon points="140,40 340,30 330,190 155,180" fill="#FEF9E7" stroke="#F39C12" stroke-width="2.5"/>
      <circle cx="340" cy="30" r="5" fill="#E74C3C"/>
      <text x="235" y="110" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#D4AC0D">PARCEL 43 (1.20 Ha)</text>

      <!-- House-level Abadi Plots -->
      <g transform="translate(35, 180)">
        <rect x="0" y="0" width="55" height="60" fill="#D5F5E3" stroke="#27AE60" stroke-width="1.5"/>
        <text x="27" y="35" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#1E8449" text-anchor="middle">H-01</text>
        
        <rect x="60" y="0" width="55" height="60" fill="#D5F5E3" stroke="#27AE60" stroke-width="1.5"/>
        <text x="87" y="35" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#1E8449" text-anchor="middle">H-02</text>

        <rect x="120" y="0" width="80" height="60" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5"/>
        <text x="160" y="35" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#D4AC0D" text-anchor="middle">Gram Panchayat</text>

        <!-- Street Line -->
        <rect x="0" y="65" width="280" height="20" fill="#F2F4F4" stroke="#BDC3C7" stroke-width="1"/>
        <text x="140" y="79" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#7F8C8D" text-anchor="middle">Main Village Paath (3.5m Road)</text>

        <rect x="0" y="90" width="65" height="65" fill="#D5F5E3" stroke="#27AE60" stroke-width="1.5"/>
        <text x="32" y="127" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#1E8449" text-anchor="middle">H-03</text>

        <rect x="70" y="90" width="65" height="65" fill="#D5F5E3" stroke="#27AE60" stroke-width="1.5"/>
        <text x="102" y="127" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#1E8449" text-anchor="middle">H-04</text>

        <rect x="140" y="90" width="140" height="65" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1.5"/>
        <text x="210" y="127" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#16A085" text-anchor="middle">Anganwadi &amp; Well</text>
      </g>
    </g>

    <g transform="translate(20, 420)">
      <rect width="480" height="35" rx="8" fill="#E8F8F5" stroke="#2ECC71" stroke-width="1"/>
      <text x="15" y="22" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1E8449">
        ✅ 100% Legal Certainty: Zero border conflict, bank mortgageable property card issued
      </text>
    </g>
  </g>
</svg>
