<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="ulpinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F6FA"/>
    </linearGradient>
    <linearGradient id="primaryBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A5276"/>
      <stop offset="100%" stop-color="#2980B9"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#F1C40F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#ulpinBg)"/>
  
  <!-- Subtle Blueprint Cadastral Grid -->
  <g stroke="#E2E8F0" stroke-width="1" opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="500" y1="0" x2="500" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Top Tricolor Bar -->
  <rect x="0" y="0" width="400" height="6" fill="#FF9933"/>
  <rect x="400" y="0" width="400" height="6" fill="#E2E8F0"/>
  <rect x="800" y="0" width="400" height="6" fill="#138808"/>

  <!-- Header Banner -->
  <g transform="translate(60, 60)">
    <rect width="1080" height="70" rx="12" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.04))"/>
    <circle cx="45" cy="35" r="22" fill="#1A5276"/>
    <text x="45" y="42" font-family="Inter, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">भू</text>
    <text x="80" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1A5276">BHU-AADHAAR (ULPIN) · 14-DIGIT UNIQUE LAND PARCEL IDENTIFIER</text>
    <text x="80" y="52" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6C757D">Georeferenced Polygon Centroid Hashing · Department of Land Resources (DoLR), Government of India</text>
    <rect x="940" y="20" width="120" height="30" rx="6" fill="#E8F8F5" stroke="#2ECC71" stroke-width="1"/>
    <text x="1000" y="40" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1E8449" text-anchor="middle">ISO 19152 LADM</text>
  </g>

  <!-- Main Architecture Layout -->
  <!-- Left Side: 14-Digit Breakdown -->
  <g transform="translate(60, 160)">
    <rect width="520" height="460" rx="16" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect width="520" height="45" rx="16" fill="#EAF2FA"/>
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#1A5276">ULPIN SYNTAX DECODING ARCHITECTURE</text>

    <!-- 14-digit visual blocks -->
    <g transform="translate(20, 65)">
      <!-- Example ULPIN: 14-78-9023-4412-MH -->
      <g transform="translate(0, 0)">
        <rect width="55" height="50" rx="8" fill="#1A5276"/>
        <text x="27" y="32" font-family="JetBrains Mono, monospace" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">14</text>
        <text x="27" y="70" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#6C757D" text-anchor="middle">STATE</text>
        <text x="27" y="84" font-family="Inter, sans-serif" font-size="9" fill="#95A5A6" text-anchor="middle">Code (MH)</text>
      </g>
      <g transform="translate(65, 0)">
        <rect width="55" height="50" rx="8" fill="#2471A3"/>
        <text x="27" y="32" font-family="JetBrains Mono, monospace" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">08</text>
        <text x="27" y="70" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#6C757D" text-anchor="middle">DIST</text>
        <text x="27" y="84" font-family="Inter, sans-serif" font-size="9" fill="#95A5A6" text-anchor="middle">Pune (08)</text>
      </g>
      <g transform="translate(130, 0)">
        <rect width="70" height="50" rx="8" fill="#2E86C1"/>
        <text x="35" y="32" font-family="JetBrains Mono, monospace" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">0412</text>
        <text x="35" y="70" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#6C757D" text-anchor="middle">TEHSIL</text>
        <text x="35" y="84" font-family="Inter, sans-serif" font-size="9" fill="#95A5A6" text-anchor="middle">Haveli</text>
      </g>
      <g transform="translate(210, 0)">
        <rect width="70" height="50" rx="8" fill="#5499C7"/>
        <text x="35" y="32" font-family="JetBrains Mono, monospace" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">0098</text>
        <text x="35" y="70" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#6C757D" text-anchor="middle">VILLAGE</text>
        <text x="35" y="84" font-family="Inter, sans-serif" font-size="9" fill="#95A5A6" text-anchor="middle">Vadodara R.</text>
      </g>
      <g transform="translate(290, 0)">
        <rect width="180" height="50" rx="8" fill="#F39C12"/>
        <text x="90" y="32" font-family="JetBrains Mono, monospace" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">GEOHASH-88A2</text>
        <text x="90" y="70" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#D4AC0D" text-anchor="middle">PARCEL POLYGON CENTROID</text>
        <text x="90" y="84" font-family="Inter, sans-serif" font-size="9" fill="#95A5A6" text-anchor="middle">WGS-84 Precision &lt;1m</text>
      </g>
    </g>

    <!-- Details Flow -->
    <g transform="translate(20, 180)">
      <rect width="480" height="250" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="15" y="30" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1A5276">Core Interoperability Attributes</text>

      <g transform="translate(15, 50)">
        <circle cx="8" cy="8" r="4" fill="#1E8449"/>
        <text x="25" y="12" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#2C3E50">Survey Gat No. 114/2B</text>
        <text x="280" y="12" font-family="Inter, sans-serif" font-size="11" fill="#7F8C8D">Area: 2.45 Hectares</text>
      </g>
      <g transform="translate(15, 80)">
        <circle cx="8" cy="8" r="4" fill="#2E86C1"/>
        <text x="25" y="12" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#2C3E50">Centroid Coordinates</text>
        <text x="280" y="12" font-family="JetBrains Mono, monospace" font-size="10" fill="#2980B9">18.5204° N, 73.8567° E</text>
      </g>
      <g transform="translate(15, 110)">
        <circle cx="8" cy="8" r="4" fill="#F39C12"/>
        <text x="25" y="12" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#2C3E50">Land Title Status</text>
        <text x="280" y="12" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1E8449">Verified Clear (No Litigation)</text>
      </g>
      <g transform="translate(15, 140)">
        <circle cx="8" cy="8" r="4" fill="#9B59B6"/>
        <text x="25" y="12" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#2C3E50">Bank Encumbrance</text>
        <text x="280" y="12" font-family="Inter, sans-serif" font-size="11" fill="#7F8C8D">KCC Crop Loan SBI · Nil Lien</text>
      </g>
      <g transform="translate(15, 170)">
        <circle cx="8" cy="8" r="4" fill="#E74C3C"/>
        <text x="25" y="12" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#2C3E50">DigiLocker Integration</text>
        <text x="280" y="12" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#2E86C1">Auto-Linked via Aadhaar OTP</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Cadastral Map Polygon Visualization -->
  <g transform="translate(620, 160)">
    <rect width="520" height="460" rx="16" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect width="520" height="45" rx="16" fill="#EAF2FA"/>
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#1A5276">CADASTRAL GIS PARCEL BOUNDARIES (SVAMITVA DRONE ORI)</text>

    <!-- Map Canvas Simulation -->
    <g transform="translate(20, 65)">
      <rect width="480" height="365" rx="10" fill="#F4F8FA" stroke="#CBD5E1" stroke-width="1"/>
      
      <!-- Neighboring Parcels -->
      <polygon points="40,30 160,20 180,140 50,150" fill="#EAFAF1" stroke="#27AE60" stroke-width="2"/>
      <text x="100" y="90" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#1E8449">PARCEL 114/1</text>

      <polygon points="160,20 340,30 360,130 180,140" fill="#FEF9E7" stroke="#F39C12" stroke-width="2"/>
      <text x="250" y="85" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#D4AC0D">PARCEL 114/2A</text>

      <polygon points="340,30 460,40 450,170 360,130" fill="#EBF5FB" stroke="#2980B9" stroke-width="2"/>
      <text x="400" y="105" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#1A5276">PARCEL 115</text>

      <!-- Target Highlighted Parcel with Centroid Marker -->
      <polygon points="50,150 180,140 220,280 120,330 40,260" fill="#D5E6F5" stroke="#1A5276" stroke-width="3.5" filter="drop-shadow(0 4px 10px rgba(26,82,118,0.2))"/>
      
      <!-- Centroid Pulse -->
      <circle cx="125" cy="220" r="18" fill="#F39C12" opacity="0.25"/>
      <circle cx="125" cy="220" r="8" fill="#F39C12" stroke="#FFFFFF" stroke-width="2"/>
      
      <!-- Target Label Card -->
      <g transform="translate(145, 195)">
        <rect width="180" height="50" rx="8" fill="#1A5276"/>
        <text x="12" y="20" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#F9E79F">TARGET ULPIN PARCEL</text>
        <text x="12" y="38" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#FFFFFF">14-08-0412-0098</text>
      </g>

      <!-- South Parcels -->
      <polygon points="180,140 360,130 400,270 220,280" fill="#EAFAF1" stroke="#27AE60" stroke-width="2"/>
      <text x="280" y="210" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#1E8449">PARCEL 114/3</text>

      <polygon points="220,280 400,270 440,350 200,355 120,330" fill="#F9EBEA" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="4"/>
      <text x="290" y="320" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#C0392B">VILLAGE COMMONS (GAOTHAN)</text>
    </g>
  </g>
</svg>
