<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A5276"/>
      <stop offset="60%" stop-color="#2471A3"/>
      <stop offset="100%" stop-color="#2E86C1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="240" rx="16" fill="url(#headerGrad)"/>

  <!-- Top Tricolor Ribbon -->
  <rect x="0" y="0" width="266.6" height="5" fill="#FF9933"/>
  <rect x="266.6" y="0" width="266.6" height="5" fill="#FFFFFF"/>
  <rect x="533.2" y="0" width="266.8" height="5" fill="#138808"/>

  <!-- Subtle Blueprint Geo Grid in Background -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="240"/>
    <line x1="400" y1="0" x2="400" y2="240"/>
    <line x1="500" y1="0" x2="500" y2="240"/>
    <line x1="600" y1="0" x2="600" y2="240"/>
    <line x1="700" y1="0" x2="700" y2="240"/>
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
  </g>

  <!-- Left Emblem Circle -->
  <g transform="translate(90, 120)">
    <circle cx="0" cy="0" r="48" fill="#FFFFFF" opacity="0.15"/>
    <circle cx="0" cy="0" r="40" fill="#FFFFFF"/>
    <!-- Ashoka Chakra Spokes in Deep Blue -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1A5276" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="7" fill="#1A5276"/>
    <!-- 24 Spokes generated geometrically -->
    <path d="
      M0,-28 L0,28 M-28,0 L28,0
      M-19.8,-19.8 L19.8,19.8 M-19.8,19.8 L19.8,-19.8
      M-10.7,-25.9 L10.7,25.9 M-25.9,-10.7 L25.9,10.7
      M-25.9,10.7 L25.9,-10.7 M-10.7,25.9 L10.7,-25.9
    " stroke="#1A5276" stroke-width="1.2"/>
  </g>

  <!-- Central Title Text -->
  <g transform="translate(170, 75)">
    <text font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#F4BB2B" letter-spacing="2">
      GOVERNMENT OF INDIA · MINISTRY OF RURAL DEVELOPMENT
    </text>
    <text y="36" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      National Digital Platform for Land Governance
    </text>
    <text y="62" font-family="Inter, sans-serif" font-size="15" font-weight="500" fill="#D5E6F5">
      Applied Research · Policy Simulation · Evidence-Based GeoAI
    </text>
    <text y="92" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FEF9EC">
      SIH26019 · Department of Land Resources (DoLR) &amp; MIC Initiative
    </text>
  </g>

  <!-- Right Badges -->
  <g transform="translate(680, 120)">
    <rect x="-60" y="-45" width="120" height="90" rx="10" fill="#FFFFFF" opacity="0.12"/>
    <text y="-18" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#F4BB2B" text-anchor="middle">COVERAGE</text>
    <text y="8" font-family="Inter, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">93.2%</text>
    <text y="26" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#D5E6F5" text-anchor="middle">Villages Digitized</text>
  </g>
</svg>
