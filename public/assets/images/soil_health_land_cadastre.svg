<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="soilBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDFBF7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#soilBg)"/>
  <rect x="0" y="0" width="400" height="6" fill="#FF9933"/>
  <rect x="400" y="0" width="400" height="6" fill="#E2E8F0"/>
  <rect x="800" y="0" width="400" height="6" fill="#138808"/>

  <g transform="translate(60, 50)">
    <rect width="1080" height="70" rx="12" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <circle cx="45" cy="35" r="22" fill="#7D6608"/>
    <!-- Leaf / Soil Icon -->
    <path d="M45,20 C35,28 35,42 45,48 C55,42 55,28 45,20 Z" fill="#F1C40F"/>
    <text x="80" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1A5276">SOIL HEALTH &amp; AGRICULTURAL LAND PRODUCTIVITY CADASTRE</text>
    <text x="80" y="52" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6C757D">Ministry of Agriculture &amp; Farmers Welfare (MoA&amp;FW) · National Soil Health Card (SHC) Parcel Integration</text>
    <rect x="940" y="20" width="120" height="30" rx="6" fill="#FEF9E7" stroke="#F39C12" stroke-width="1"/>
    <text x="1000" y="40" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#B7950B" text-anchor="middle">NPK &amp; OC INDEX</text>
  </g>

  <!-- Left: Agricultural Parcel Nutrient Grid -->
  <g transform="translate(60, 150)">
    <rect width="660" height="470" rx="16" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect width="660" height="45" rx="16" fill="#EAF2FA"/>
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#1A5276">PARCEL-LEVEL SOIL HEALTH HEATMAP (VILLAGE CLUSTER)</text>

    <g transform="translate(30, 65)">
      <!-- Parcel 1: Optimal Nitrogen (Green) -->
      <polygon points="30,30 180,20 200,160 40,170" fill="#D5F5E3" stroke="#27AE60" stroke-width="2"/>
      <text x="110" y="85" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#1E8449">PARCEL 88/1A</text>
      <text x="110" y="105" font-family="Inter, sans-serif" font-size="9" fill="#27AE60">OC: 0.85% (High)</text>
      <text x="110" y="120" font-family="Inter, sans-serif" font-size="9" fill="#27AE60">Yield: 4.8 T/Ha Wheat</text>

      <!-- Parcel 2: Deficient Phosphorus (Amber) -->
      <polygon points="180,20 380,30 360,150 200,160" fill="#FEF9E7" stroke="#F39C12" stroke-width="2"/>
      <text x="270" y="85" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#B7950B">PARCEL 88/1B</text>
      <text x="270" y="105" font-family="Inter, sans-serif" font-size="9" fill="#D4AC0D">OC: 0.42% (Medium)</text>
      <text x="270" y="120" font-family="Inter, sans-serif" font-size="9" fill="#D4AC0D">Phosphorus Deficient</text>

      <!-- Parcel 3: High Salinity / Degraded (Red) -->
      <polygon points="380,30 580,40 560,180 360,150" fill="#FADBD8" stroke="#E74C3C" stroke-width="2"/>
      <text x="470" y="85" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#C0392B">PARCEL 89/1</text>
      <text x="470" y="105" font-family="Inter, sans-serif" font-size="9" fill="#E74C3C">pH: 8.9 (Alkaline)</text>
      <text x="470" y="120" font-family="Inter, sans-serif" font-size="9" fill="#E74C3C">Gypsum Required 2.5T</text>

      <!-- Parcel 4: Bio-char Treated Regenerative (Lush Green) -->
      <polygon points="40,170 200,160 220,330 30,310" fill="#EAFAF1" stroke="#1E8449" stroke-width="2.5"/>
      <text x="120" y="240" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#145A32">PARCEL 88/2</text>
      <text x="120" y="260" font-family="Inter, sans-serif" font-size="9" fill="#1E8449">Regenerative Agroforestry</text>
      <text x="120" y="275" font-family="Inter, sans-serif" font-size="9" fill="#1E8449">Carbon Sequester: +1.2 T</text>

      <!-- Parcel 5: Balanced Loam (Green-Yellow) -->
      <polygon points="200,160 460,160 440,320 220,330" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="2"/>
      <text x="330" y="240" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#16A085">PARCEL 88/3</text>
      <text x="330" y="260" font-family="Inter, sans-serif" font-size="9" fill="#117864">Micro-Nutrient Balanced</text>
      <text x="330" y="275" font-family="Inter, sans-serif" font-size="9" fill="#117864">Zinc/Iron Fortified</text>

      <!-- Water Reservoir -->
      <circle cx="510" cy="250" r="45" fill="#D4E6F1" stroke="#2980B9" stroke-width="2"/>
      <text x="510" y="253" font-family="Inter, sans-serif" font-size="9" font-weight="800" fill="#1A5276" text-anchor="middle">Farm Pond</text>
    </g>
  </g>

  <!-- Right: Farm Economics & Soil Card Linkage -->
  <g transform="translate(750, 150)">
    <rect width="390" height="470" rx="16" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
    <rect width="390" height="45" rx="16" fill="#EAF2FA"/>
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#1A5276">NATIONAL SOIL CARD DIRECTIVE</text>

    <g transform="translate(20, 65)">
      <rect width="350" height="85" rx="10" fill="#D5F5E3" stroke="#27AE60" stroke-width="1"/>
      <text x="15" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1E8449">Soil Health Cards Geo-Tagged</text>
      <text x="15" y="58" font-family="Inter, sans-serif" font-size="24" font-weight="900" fill="#145A32">23.8 Crore Cards</text>
      <text x="335" y="58" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#1E8449" text-anchor="end">100% Parcels</text>

      <g transform="translate(0, 100)">
        <rect width="350" height="85" rx="10" fill="#FEF9E7" stroke="#F39C12" stroke-width="1"/>
        <text x="15" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#B7950B">Fertilizer Subsidy Optimization</text>
        <text x="15" y="58" font-family="Inter, sans-serif" font-size="24" font-weight="900" fill="#7D6608">₹24,500 Cr Saved</text>
        <text x="335" y="58" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#B7950B" text-anchor="end">Via Precision NPK</text>
      </g>

      <g transform="translate(0, 200)">
        <rect width="350" height="145" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
        <text x="15" y="25" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1A5276">Automated Fertilizer Prescription</text>
        <text x="15" y="48" font-family="Inter, sans-serif" font-size="10" fill="#6C757D">When a farmer clicks on their ULPIN parcel,</text>
        <text x="15" y="65" font-family="Inter, sans-serif" font-size="10" fill="#6C757D">the platform instantly outputs exact micro-nutrient</text>
        <text x="15" y="82" font-family="Inter, sans-serif" font-size="10" fill="#6C757D">requirements for the upcoming Kharif / Rabi cycle,</text>
        <text x="15" y="99" font-family="Inter, sans-serif" font-size="10" fill="#6C757D">reducing urea overuse by 22%.</text>
        <text x="15" y="125" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#1E8449">Kisan Call Centre (1800-180-1551) Synced</text>
      </g>
    </g>
  </g>
</svg>
